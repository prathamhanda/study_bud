# Cloudflare Pages Configuration for StudyBud
# This file is for reference - Cloudflare Pages reads _headers and _redirects from output directory
# Wrangler.toml is only needed if using Cloudflare Pages Functions (Workers)

name = "studybud"
compatibility_date = "2024-11-08"
pages_build_output_dir = "dist"

# Environment variables (set in Cloudflare Pages dashboard, not here)
# [vars]
# VITE_SUPABASE_URL = "https://yjdcshkqgzcubniinwoc.supabase.co"
# VITE_SUPABASE_ANON_KEY = "your-anon-key"
# VITE_GOOGLE_CLIENT_ID = "your-client-id"
# VITE_GEMINI_API_KEY = "your-gemini-key"
# VITE_VIDEO_GEN_URL = "https://your-video-gen-domain.com/api/generate"

# Custom domain: studybud.prathamh.com (configure in Cloudflare Pages dashboard)

# Build command (run in Cloudflare Pages dashboard settings)
# Build command: npm run build
# Build output directory: dist
# Root directory: (repo root)

# Node.js version (set in Pages dashboard: NODE_VERSION = 20)